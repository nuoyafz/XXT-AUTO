        // 给AI编程定制 当传fids时取第一个赋值fid
        var fids = getURLQuery("fids");
        var fid = getURLQuery("fid");
        if (fids && (!fid || fid == "-1" || fid == "0")) {
            // fid 为空/-1/0 且 fids 有值时，取 fids 第一个作为 fid，剔除 fids 与 fid 后拼接其余参数重定向
            var firstFid = fids.split(",")[0];
            var search = window.location.search.replace(/^\?/, "");
            var pms = [];
            if (search) {
                search.split("&").forEach(function (item) {
                    var key = item.split("=")[0];
                    if (key !== "fids" && key !== "fid" && item !== "") {
                        pms.push(item);
                    }
                });
            }
            pms.unshift("fid=" + firstFid);
            window.location.href = window.location.pathname + "?" + pms.join("&");
        }

<script type="text/javascript">
    /***/
    function to_third_login(type, ref) {
        var fd = $("#fid").val();
        if ("qq" == type) {
            window.location.href = "/oauth2/qq?newversion=true&fid=" + fd + "&refer=" + $("#refer").val();
        } else if ("weixin" == type) {
            window.location.href = "/oauth2/weixin?newversion=true&fid=" + fd + "&refer=" + $("#refer").val();
        } else if ("google" == type) {
            window.location.href = "/oauth2/google?newversion=true&fid=" + fd + "&refer=" + $("#refer").val();
        } else if ("microsoft" == type) {
            window.location.href = "/oauth2/microsoft?newversion=true&fid=" + fd + "&refer=" + $("#refer").val();
        }
    }

    function hideQRcode() {
        $(".right").hide();
        $(".default-login-main").attr("class", "main default-login-min");
    }


    function changeUser() {
        window.location.reload();
    }

    var qrInterValObj;
    var enc = $("#enc").val();
    var uuid = $("#uuid").val();
    var ref = decodeURIComponent($("#refer").val());
    var c = 0;

    //超星阅读器 SSREADER/4.1.6.0001 主版本号大于等于4 隐藏扫码登录
    let userAgent = navigator.userAgent;
    if (userAgent.indexOf("SSREADER/") > -1) {
        let versionArr = userAgent.substr(0, 10).split("/");
        if (versionArr[1] >= 4) {
            hideQRcode();
        }
    }

    //定制不显示二维码
    if (1 != 1 || 1 != 1) {
        hideQRcode();
    } else if (-1 == 34415) {
        $("#quickCode").attr("src", "images/guide/34415ewm.png");
        $("#quickCodeMsg").html("扫一扫下载移动客户端");
    } else if (-1 == 9566) {
        $("#quickCode").attr("src", "images/guide/9566ewm.jpg");
        $("#quickCodeMsg").html("扫一扫关注微信公众号");
    } else if (-1 == 341321) {
        $("#quickCode").attr("src", "https://passport2-static.chaoxing.com/images/fanya/jiaoyuxiehuibj.png");
        $("#quickCodeMsg").html('欢迎关注“浙江省研究生教育学会”公众号');
    } else {
        qrInterValObj = window.setInterval(loopStatus, 3000); //启动计时器，1秒执行一次
        if (-1 == 35014) {
            $("#quickCodeMsg").html("国科大在线APP扫码登录");
            //定制二维码扫码后提示语修改
            $("#step2 p.g_code_over").html("请在移动端上点击确认以登录");
        }
    }
    var QRCodeTip = $("#QRCodeTip").val();
    if (QRCodeTip != "") {
        $("#quickCodeMsg").html(QRCodeTip);
    }

    //重新加载二维码
    function refrushEwm() {
        window.location.reload();
    }

    function loopStatus() {

        jQuery.ajax({
            url: _CP_ + "/getauthstatus/v2",
            type: 'post',
            async: true,
            data: {
                "enc": enc, "uuid": uuid, "doubleFactorLogin": $('#doubleFactorLogin').val(),
                "forbidotherlogin": $('#forbidotherlogin').val()
            },
            dataType: 'json',
            success: function (data) {
                if (c >= 50) {
                    window.clearInterval(qrInterValObj);//停止计时器
                    $(".ewmDisable").show();
                    //window.location.reload();
                }
                c++;//记录循环次数
                if (data.status) {
                    window.clearInterval(qrInterValObj);//停止计时器
                    $("#logining").show();
                    if (ref != "undefined" && ref != '') {
                        var url;
                        if (ref == window.location.href) {
                            url = "http://i.mooc.chaoxing.com/space/index";
                        } else {
                            url = ref;
                        }

                        if (data['containTwoFactorLogin']) {
                            url = data['twoFactorLoginPCUrl'] + "&refer=" + encodeURIComponent(url);
                        }

                        if (top.location != self.location && $('#_blank').val() == "1") {
                            top.location = url;
                        } else {
                            window.location = url;
                        }
                    } else {
                        var url = "http://i.mooc.chaoxing.com/space/index";

                        if (data['containTwoFactorLogin']) {
                            url = data['twoFactorLoginPCUrl'] + "&_blank=" + _blank + "&refer=" + encodeURIComponent(url);
                        }

                        if (window.parent != this.window) {
                            window.open(url, "_blank");
                        } else {
                            location.href = url;
                        }
                    }
                } else {
                    if (data.type == 4) {//
                        $("#shownickname").html(data.nickname);
                        $("#photo").attr('src', "http://photo.chaoxing.com/p/" + data.uid + "_160");
                        $("#step1").hide();
                        $("#step2").show();
                    } else if (data.type == 6) {//客户端取消
                        location.reload();
                    } else if (data.type == 7) {
                        util.showMsg(true, "err-txt", data['mes']);
                        $("#shownickname").html("");
                        $("#photo").attr('src', "");
                        $("#step1").show();
                        $("#step2").hide();
                        refreshQRCode();
                    } else if (data.type == 2) {//二维码/会话已失效（含服务端会话归属校验不通过）
                        window.clearInterval(qrInterValObj);//停止计时器
                        c = 0;
                        refreshQRCode();
                    }
                }
            }

        });

        }
        if (agent.indexOf("win64") >= 0 || agent.indexOf("wow64") >= 0) {
